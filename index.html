<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Photo</title></head>
<body style="margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#111;">
<img id="photo" style="max-width:100%;max-height:100vh;" />
<script>
  fetch('photo-url.txt?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.text())
    .then(name => {
      document.getElementById('photo').src = name.trim() + '?t=' + Date.now();
    });
</script>
</body>
</html>
